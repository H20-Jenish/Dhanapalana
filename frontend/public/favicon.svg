      <stop offset="0%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFBF00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Deep Sapphire Blue Base (Trust/Security context) -->
  <rect width="128" height="128" rx="28" fill="#0B3150" />

