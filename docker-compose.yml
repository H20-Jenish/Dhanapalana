# Dhanapālana - Personal Finance Management System
# Docker Compose Configuration
#
# This docker-compose.yml file defines the complete containerized architecture
# for the Dhanapālana personal finance application. It orchestrates multiple
# services including frontend, backend, database, and reverse proxy.
#
# ARCHITECTURAL OVERVIEW:
# - Multi-service containerized application
# - Network segmentation for security (edge, app, airgap networks)
# - Persistent data volumes for database and backups
# - Automatic service dependency management
# - Health monitoring and restart policies
#
# SECURITY DESIGN:
# - Network isolation: airgap_net for internal services only
# - External access through nginx reverse proxy
# - SSL/TLS termination at edge
# - Docker socket access restricted to backend only
# - Root user for backend (required for Docker operations)
#
# SERVICES ARCHITECTURE:
# frontend: React.js web application (port 3000 internal)
# backend: Express.js API server with Docker management capabilities
# db: PostgreSQL 13 database with persistent storage
# nginx: Reverse proxy with SSL termination and load balancing
#
# NETWORK SEGMENTS:
# edge_net: External access network (internet-facing)
# app_net: Application services network (frontend, backend, nginx)
# airgap_net: Isolated internal network (backend and db only)
#
# DATA PERSISTENCE:
# vault_pgdata: PostgreSQL database files
# vault_backups: Automated backup storage
#
# DEPLOYMENT NOTES:
# - Requires .env file with DB_USER, DB_PASSWORD, DB_NAME
# - First run initializes system and builds AI model
# - Nginx handles SSL certificates from nginx-certs directory
# - Backend has Docker socket access for container management

version: '3.8'

services:
  # FRONTEND SERVICE: React.js Web Application
  # Serves the user interface with hot reloading in development
  frontend:
    build: ./frontend
    container_name: vault_frontend
    environment:
      - TZ=${APP_TIMEZONE:-America/Toronto}
      - CHOKIDAR_USEPOLLING=true  # Enable polling for file watching in containers
    restart: unless-stopped
    networks:
      - app_net  # Application network for backend communication
    depends_on:
      - backend  # Wait for backend to be ready

  # BACKEND SERVICE: Express.js API Server
  # Core application logic with Docker management capabilities
  backend:
    build: ./backend
    container_name: vault_backend
    user: root  # Required for Docker socket access and system operations
    environment:
      - TZ=${APP_TIMEZONE:-America/Toronto}  # System timezone
      - DB_USER=${DB_USER}  # Database credentials from environment
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db  # Database service name
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker socket for container management
      - vault_backups:/backups  # Persistent backup storage
      - ./backend/server.js:/app/server.js:ro  # Keep runtime API logic aligned with workspace fixes
    networks:
      - app_net   # Application network for frontend communication
      - airgap_net  # Isolated network for database and AI access
    depends_on:
      - db  # Database must be ready first

  # DATABASE SERVICE: PostgreSQL 13
  # Persistent data storage for financial records and user data
  db:
    image: postgres:13
    container_name: vault_db
    restart: unless-stopped
    environment:
      - TZ=${APP_TIMEZONE:-America/Toronto}  # Consistent timezone
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - vault_pgdata:/var/lib/postgresql/data  # Persistent database files
    networks:
      - airgap_net  # Isolated network, no external access

  # REVERSE PROXY: Nginx with SSL Termination
  # Handles external traffic, SSL, and load balancing
  nginx:
    image: nginx:alpine
    container_name: vault_nginx
    environment:
      - TZ=${APP_TIMEZONE:-America/Toronto}
    ports:
      - "80:80"    # HTTP port
      - "443:443"  # HTTPS port
    volumes:
      - ./nginx_setup/nginx.conf:/etc/nginx/nginx.conf:ro  # Nginx configuration
      - ./nginx_setup/nginx-certs:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      - frontend  # Frontend must be ready
      - backend   # Backend must be ready
    networks:
      - edge_net   # External access network
      - app_net    # Internal application network
    restart: always

# PERSISTENT VOLUMES: Data that survives container restarts
volumes:
  vault_pgdata:    # PostgreSQL database files
    name: vault_pgdata
    external: false
  vault_backups:   # Automated backup files
    name: vault_backups

# DOCKER NETWORKS: Service communication and isolation
networks:
  edge_net:    # External/internet-facing network
    driver: bridge
  app_net:     # Application services network
    driver: bridge
  airgap_net:  # Isolated internal network (no external access)
    internal: true