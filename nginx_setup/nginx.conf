# Dhanapālana Nginx Configuration
# Reverse proxy and SSL termination for the personal finance application
# Handles routing between React frontend and Express backend with security features
# Author: Dhanapālana Development Team
# Description: Production-ready nginx configuration with SSL, security headers, and API routing

# Event loop configuration for handling concurrent connections
events {
    worker_connections 1024;  # Maximum concurrent connections per worker
}

http {
    # Include MIME types for proper content serving
    include       mime.types;
    default_type  application/octet-stream;

    # Basic performance settings
    sendfile        on;         # Enable sendfile for efficient file serving
    keepalive_timeout  65;      # Keep connections alive for 65 seconds

    # Define internal Docker network routing
    # Routes traffic to containerized services
    upstream frontend_app {
        server frontend:3000;   # React development server
    }

    upstream backend_api {
        server backend:5000;    # Express API server
    }

    # ===========================================
    # SECURITY HEADERS
    # ===========================================
    server_tokens off;  # Hide nginx version for security
    add_header X-Frame-Options "SAMEORIGIN" always;      # Prevent clickjacking
    add_header X-Content-Type-Options "nosniff" always;  # Prevent MIME sniffing
    add_header X-XSS-Protection "1; mode=block" always;  # XSS protection

    # ===========================================
    # SERVER CONFIGURATIONS
    # ===========================================

    # 1. HTTP to HTTPS Redirect
    # Force all HTTP traffic to use secure HTTPS connection
    server {
        listen 80;
        server_name localhost; # Replace with domain if needed
        return 301 https://$host$request_uri;  # Permanent redirect to HTTPS
    }

    # 2. Secure HTTPS Server Configuration
    server {
        listen 443 ssl;
        server_name localhost;

        # ===========================================
        # SSL/TLS CONFIGURATION
        # ===========================================
        ssl_certificate /etc/nginx/ssl/vault.crt;        # SSL certificate path
        ssl_certificate_key /etc/nginx/ssl/vault.key;    # Private key path

        # Enforce modern TLS protocols only
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Strong cipher suite prioritizing forward secrecy
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES256-GCM-SHA384";

        # HTTP Strict Transport Security (HSTS)
        # Force HTTPS for all future requests for 1 year
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ===========================================
        # ROUTING CONFIGURATION
        # ===========================================

        # --- ROUTE 1: REACT FRONTEND ---
        # Serve the main application and handle client-side routing
        location / {
            proxy_pass http://frontend_app;

            # Standard proxy headers for proper request forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for real-time features and live updates
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- ROUTE 2: SECURE DATABASE RESTORE ---
        # High-security endpoint for database restoration with edge validation
        location = /api/system/restore-initial {

            # Edge security: Validate file extension before proxying
            # Only allow .sql files to prevent malicious uploads
            if ($http_x_file_name !~* \.sql$) {
                return 403 "Edge Security Violation: Only .sql files are permitted.";
            }

            proxy_pass http://backend_api;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Allow large SQL backup files (up to 50MB)
            client_max_body_size 50M;
        }

        # --- ROUTE 3: BACKEND API ROUTES ---
        # Handle all other API endpoints and webhooks
        location /api/ {
            # Strip '/api/' prefix when forwarding to backend
            proxy_pass http://backend_api;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
			
			# Extend response timeout for long-running report generation
            proxy_read_timeout 300;

            # Allow large file uploads for export and backup operations
            client_max_body_size 50M;
        }
    }
}